# main에 push되면 컨테이너 이미지를 ghcr.io에 올린다. NAS는 이 이미지를 pull만 한다.
# 빌드에 Node·pnpm이 필요해 NAS에서 직접 빌드하지 않는다. kordle.db는 이미지에 없다 (Release 자산, 볼륨 마운트).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cache-to: type=gha 는 docker-container 빌더에서만 된다.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # 시놀로지 NAS(x86_64) 전용. ARM NAS를 쓰게 되면 linux/arm64를 추가한다.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
